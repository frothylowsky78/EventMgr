name: eventmgr_mobile
description: Premium guest-facing event app (iOS + Android).
publish_to: "none"
version: 1.0.0+7

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.5.0
  amazon_cognito_identity_dart_2: ^3.6.0
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  add_2_calendar: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icon/
    - assets/splash/

# App launcher icon (run: dart run flutter_launcher_icons)
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 23
  # Adaptive icon for Android 8+: brand-navy background + the gold mark in the foreground.
  adaptive_icon_background: "#1A2B4C"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  web:
    generate: true
    background_color: "#1A2B4C"
    theme_color: "#1A2B4C"

# Splash screen (run: dart run flutter_native_splash:create)
flutter_native_splash:
  color: "#1A2B4C"
  image: assets/splash/splash_logo.png
  android_12:
    color: "#1A2B4C"
    image: assets/splash/splash_logo.png
  ios: true
  android: true
  web: false
